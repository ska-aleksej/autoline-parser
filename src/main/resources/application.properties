app.target-base-url=https://autoline.info
app.target-companies-path=/companies/list/

app.emails[0] = example@example.com
app.mail-send-enabled=false

# Database (PostgreSQL из infra-postgres)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autoline}
spring.datasource.username=${DB_APP_USER:autoline_app}
spring.datasource.password=${DB_APP_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# Flyway: миграции под ролью mig (DDL), рантайм работает под ролью app (DML)
spring.flyway.user=${DB_MIG_USER:autoline_mig}
spring.flyway.password=${DB_MIG_PASSWORD:}

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

# Mail configuration
mail.token=${MAIL_TOKEN:}
mail.username=${MAIL_LOGIN:}
mail.sender=${MAIL_SENDER:}
mail.smtp.host=smtp.yandex.ru
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true

# Telegram: токен приходит из env TELEGRAM_BOT_TOKEN (не задан = бот выключен)
telegram.bot.admin-id=${TELEGRAM_ADMIN_ID:}
telegram.bot.allowed-ids=${TELEGRAM_ALLOWED_IDS:}

# Telegram bot SOCKS5 proxy
telegram.bot.proxy.enabled=false
telegram.bot.proxy.host=
telegram.bot.proxy.port=1080
telegram.bot.proxy.username=
telegram.bot.proxy.password=
